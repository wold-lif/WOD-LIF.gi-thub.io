
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOGO DA LIBERDADE | Plataforma</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7f6;color:#17202a;line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.container{width:min(1120px,92%);margin:auto}

:root{
 --green:#0b7a4b;
 --green2:#075c39;
 --light:#eef8f3;
 --dark:#101815;
 --border:#dfe6e2;
 --muted:#65716c;
 --danger:#b42318;
 --gold:#b7791f;
 --white:#fff;
}

header{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid var(--border)}
.nav{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:20px;font-weight:800}
.logo span{color:var(--green)}
.nav-actions{display:flex;gap:8px;align-items:center}
.nav-btn,.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700}
.nav-btn{background:#fff;border:1px solid var(--border)}
.btn{background:var(--green);color:#fff}
.btn:hover{background:var(--green2)}
.btn-light{background:#fff;color:var(--green);border:1px solid var(--green)}
.btn-danger{background:#fff0ef;color:var(--danger);border:1px solid #f3c5c0}

.hero{background:linear-gradient(135deg,#eaf8f1,#fff);padding:58px 0}
.hero-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:28px;align-items:center}
.tag{display:inline-block;color:var(--green);font-weight:800;font-size:12px;letter-spacing:1px;margin-bottom:12px}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.05;margin-bottom:18px}
.hero p{font-size:17px;color:#58635f;max-width:700px;margin-bottom:22px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.hero-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.hero-card strong{font-size:30px;color:var(--green);display:block}
.hero-card small{color:var(--muted)}

section{padding:55px 0}
.section-title{text-align:center;margin-bottom:30px}
.section-title h2{font-size:31px;margin-bottom:7px}
.section-title p{color:var(--muted)}

.toolbar{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 190px auto;gap:10px;margin-bottom:22px}
input,select,textarea{width:100%;padding:13px;border:1px solid #d5ddd9;border-radius:9px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(11,122,75,.1)}
textarea{min-height:110px;resize:vertical}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:20px}
.card h3{margin-bottom:7px}
.muted{color:var(--muted)}
.small{font-size:13px}
.product-card{overflow:hidden;padding:0}
.product-image{width:100%;height:210px;object-fit:cover;background:#e9eeeb;display:block}
.product-body{padding:17px}
.price{font-size:20px;font-weight:800;color:var(--green);margin:8px 0}
.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:var(--light);color:var(--green);font-size:12px;font-weight:700}
.product-actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{background:#fff;border:1px solid var(--border);border-radius:15px;padding:23px}
.number{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:800;margin-bottom:12px}

.dark{background:var(--dark);color:#fff}
.dark .section-title p,.dark .muted{color:#c6d0cb}
.form-wrap{max-width:780px;margin:auto;background:#fff;color:#17202a;border-radius:16px;padding:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.message{margin-top:12px;font-weight:700;color:var(--green)}
.error{color:var(--danger)}

.file-box{border:2px dashed #cbd7d1;padding:18px;border-radius:12px;text-align:center}
.preview{display:none;width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-top:12px}

.dashboard{background:#fff;border-top:1px solid var(--border)}
.dashboard-nav{display:flex;gap:8px;overflow:auto;padding:12px 0}
.dashboard-nav button{white-space:nowrap;border:1px solid var(--border);background:#fff;padding:9px 12px;border-radius:9px}
.dashboard-nav button.active{background:var(--green);color:#fff;border-color:var(--green)}
.panel{display:none}
.panel.active{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:#f7faf8;border:1px solid var(--border);border-radius:13px;padding:17px}
.stat strong{font-size:25px;display:block;color:var(--green)}

.table-wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:13px}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border);font-size:14px}
th{background:#f7faf8}
.thumb{width:54px;height:42px;object-fit:cover;border-radius:7px;background:#eee}

.reward-box{background:linear-gradient(135deg,#fff9e8,#fff);border:1px solid #ead7a5;border-radius:15px;padding:20px}
.share-count{font-size:36px;font-weight:900;color:var(--gold)}
.progress{height:10px;background:#e7e7e7;border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--gold);width:0%}

.notice{padding:14px;background:#fff8e5;border:1px solid #eddcae;border-radius:10px;margin-top:15px;font-size:13px}
footer{background:#101815;color:#b7c2bd;text-align:center;padding:30px 0;font-size:13px}
footer strong{color:#fff}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:2000;padding:18px;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:20px}
.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}
.close{border:0;background:#eee;width:36px;height:36px;border-radius:50%;font-size:20px}

.empty{text-align:center;padding:35px;color:var(--muted);background:#fff;border:1px dashed var(--border);border-radius:13px}

@media(max-width:850px){
 .hero-grid,.grid,.steps{grid-template-columns:1fr}
 .toolbar{grid-template-columns:1fr}
 .form-grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .stats{grid-template-columns:1fr 1fr}
 .nav-actions .optional{display:none}
}
</style>
</head>
